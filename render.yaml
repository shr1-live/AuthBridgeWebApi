# Render Blueprint for the self-contained AuthBridge demo. Render hosts both the API and its
# PostgreSQL database; no Supabase or other external integration is required.
services:
  - type: web
    name: authbridge-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: Postgres
      # Runtime-role connection string copied from the Supabase project (session pooler if the
      # direct IPv6 host is unreachable from Render). Not the migration/owner credentials.
      - key: Database__ConnectionString
        fromDatabase:
          name: authbridge-db
          property: connectionString
      - key: Auth__Mode
        value: Demo
      - key: Auth__Demo__Issuer
        value: authbridge-render-demo
      - key: Auth__Demo__Audience
        value: authenticated
      - key: Auth__Demo__SigningKey
        generateValue: true
      # Exact Vercel production origin, e.g. https://authbridge-ui.vercel.app
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Workflow__ReviewUrlBase
        sync: false
      - key: Simulation__Enabled
        value: "true"
      # Optional: turns on the in-app assistant. Server-side secret; never in git or the frontend.
      - key: Assistant__ApiKey
        sync: false

databases:
  - name: authbridge-db
    plan: free
    databaseName: authbridge
    user: authbridge
