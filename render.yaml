# Render Blueprint for the AuthBridge backend: ONE free Docker web service that hosts the
# controller API, the authenticated /mcp endpoint and the payer simulator.
# Nothing here deploys by itself; applying the Blueprint is a manual step (docs/DEPLOYMENT.md).
# Values marked sync: false are secrets or project-specific and are entered in the Render
# dashboard - never committed.
services:
  - type: web
    name: authbridge-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: false
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: Postgres
      # Runtime-role connection string copied from the Supabase project (session pooler if the
      # direct IPv6 host is unreachable from Render). Not the migration/owner credentials.
      - key: Database__ConnectionString
        sync: false
      - key: Auth__Mode
        value: Supabase
      # https://<project-ref>.supabase.co/auth/v1
      - key: Auth__Supabase__Issuer
        sync: false
      # https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json
      - key: Auth__Supabase__JwksUri
        sync: false
      - key: Auth__Supabase__Audience
        value: authenticated
      # Exact Vercel production origin, e.g. https://authbridge-ui.vercel.app
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Workflow__ReviewUrlBase
        sync: false
      - key: Simulation__Enabled
        value: "true"
